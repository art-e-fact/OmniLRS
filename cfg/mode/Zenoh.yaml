name: Zenoh

keyexprs:

  # multi-instance channels: child topics will be appended (sensor name from robot.yaml, i.e: high_res, low_res, ..)
  camera:            "OmniLRS/{robot_name}/camera"   # -> OmniLRS/husky/camera/left_color
  imu:               "OmniLRS/{robot_name}/imu"      # -> OmniLRS/husky/imu/adxl6090

  # singletons: full keys, nothing appended
  joint_telemetry:   "OmniLRS/{robot_name}/joint_telemetry"
  joint_commands:    "OmniLRS/{robot_name}/joint_cmd"
  ground_truth_pose: "OmniLRS/{robot_name}/gt_pose"
  is_sim_running:    "OmniLRS/sim/is_running"
  randomize_rocks:   "OmniLRS/terrain/randomize_rocks"
